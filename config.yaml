    - "我发现"
    - "反思"
    - "让我思考"
    - "知识盲区"
    - "上个.*漏洞"
    - "弱.*假设"
    - "薄弱"
    - "最弱"
  reasoning_patterns:
    - "第一步"
    - "第二步"
    - "第三步"
    - "第1步"
    - "第2步"
    - "第3步"
    - "如果.*那么.*因为"
    - "假设.*则.*所以"
    - "step 1"
    - "step 2"
    - "therefore"
    - "because if"
    - "那是不是说"
    - "如果.*那么"
    - "因为.*所以"
    - "进一步"
