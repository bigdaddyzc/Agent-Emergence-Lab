    - "所以最终"
    - "因果"
    - "因为.*所以.*意味着"
    - "步骤1.*步骤2.*步骤3"
  knowledge_markers:
    - "新洞见"
    - "关键发现"
    - "阶段性总结"
    - "Insight"
    - "novel idea"
    - "总结.*观点"
    - "达成了共识"
    - "我们发现"
  challenge_patterns:
    - "【质疑"
    - "有没有可能"
    - "反例"
    - "真的吗"
    - "一定成立"
    - "不同意"
    - "漏洞"
    - "然而"
    - "不过"
    - "另一方面"
    - "但从另一个角度"
    - "我不是很确定"
    - "这不一定"
    - "counterexample"
    - "challenge"
    - "disagree"
    - "however"

logging:
  base_dir: "logs"
  conversation_dir: "logs/conversations"
  memory_dir: "logs/memory"
  log_level: "INFO"

ollama:
  host: "http://localhost:11434"
  timeout: 900
  keep_alive: "30m"

feishu:
  enabled: false   # set true only after filling in real webhook URLs below
  agent_a_webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/XXXX"
  agent_b_webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/XXXX"
